# Compressed swap in RAM. The RG DS Plus has 953 MB and no swap; a coding
# agent's TUI (Codex: 250 MB in 5 s, past 430 MB in 45 s) beside the shell
# left the kernel evicting program text until nothing answered. zstd holds
# about three pages in one, so a full device costs some 160 MB.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
