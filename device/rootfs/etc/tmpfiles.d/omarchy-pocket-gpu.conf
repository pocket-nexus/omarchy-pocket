# The shell raises the GPU's and the CPU's lowest clocks while the user is
# working (host/src/floor.rs): simple_ondemand leaves the Mali-G52 at 200 MHz
# through a 200 ms window animation, and schedutil leaves the Cortex-A55s at
# 408 MHz through a 60 Hz tick of guest work. The video group may write the
# floors.
z /sys/class/devfreq/fde60000.gpu/min_freq 0664 root video -
z /sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq 0664 root video -
# The power-saver profile caps both clocks (the ceilings), the host writes.
z /sys/class/devfreq/fde60000.gpu/max_freq 0664 root video -
z /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq 0664 root video -
