# The shell raises the Cortex-A72s' lowest clock while the user is working
# (host/src/floor.rs): ondemand leaves them at 600 MHz through a 60 Hz tick
# of guest work, where a present of the 1280 x 720 stage costs 15 to 20 ms.
# The video group may write the floor, and the power-saver profile's ceiling.
z /sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq 0664 root video -
z /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq 0664 root video -
