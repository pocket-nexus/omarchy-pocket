[package]
name = "omarchy-pocket-host"
edition.workspace = true
description = "Omarchy Pocket's device program on the Anbernic RG DS Plus: both DSI panels through libmali GBM/EGL/GLES on KMS, the gamepad and touch through evdev, the Omarchy bridge"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "omarchy-pocket-host"
path = "src/main.rs"

# The AYN Thor's program, loaded by the Android app (android/app); empty on
# every other target.
[lib]
name = "omarchy_pocket"
path = "src/android.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pocket-runtime.workspace = true
pocket-drivers.workspace = true
pocket-raster.workspace = true
pocket-package.workspace = true
pocket-spec.workspace = true
pocket-guest-rquickjs.workspace = true
pocket-linux-hooks.workspace = true
pocket-linux-drm.workspace = true
pocket-linux-evdev.workspace = true
pocket-linux-worker.workspace = true
serde_json = "1"
rquickjs.workspace = true
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
pocket-gles.workspace = true
pocket-gles2.workspace = true
drm = { version = "0.14.1", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
pocket-gles.workspace = true
pocket-gles2.workspace = true
jni = { version = "0.21", default-features = false }
# rquickjs ships no bindings for aarch64-linux-android; bindgen writes them
# against the NDK's headers (libclang from the Xcode command line tools)
rquickjs = { workspace = true, features = ["bindgen"] }
# the app's Linux root arrives as a .tar.zst (android.rs install_root)
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }

[build-dependencies]
pocket-profile-build.workspace = true
